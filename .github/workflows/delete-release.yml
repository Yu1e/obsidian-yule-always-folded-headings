name: Delete release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to delete (the git tag itself stays)
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ inputs.tag }}" --yes --repo "$GITHUB_REPOSITORY"
